<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - PinkSocial Hub</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>

        /* GLOBAL */

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        header {
            background: #111111;
            border-bottom: 2px solid #ff1493;
            padding: 1rem 2rem;
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        header h1 {
            margin: 0;
            color: #ff69b4;
            font-size: 2rem;
        }

        /* NAVIGATION */

        nav ul {
            list-style: none;
            display: flex;
            gap: 1rem;
            padding: 0;
            margin: 0;
            flex-wrap: wrap;
        }

        nav ul li {
            display: inline;
        }

        nav a,
        nav button {
            text-decoration: none;
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            color: white;
            padding: 0.7rem 1.2rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s ease;
            display: inline-block;
        }

        nav a:hover,
        nav button:hover {
            transform: translateY(-3px);
            background: linear-gradient(45deg, #ff69b4, #ff1493);
        }

        /* MAIN */

        main {
            flex: 1;
            padding: 2rem 1rem;
        }

        .profile {
            max-width: 750px;
            margin: auto;
        }

        /* PROFILE CARD */

        .profile-card {
            background: #111111;
            border: 2px solid #ff1493;
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.2);
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            border-radius: 50%;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            margin-bottom: 1rem;
        }

        .profile-card h2 {
            color: #ff69b4;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .profile-card p {
            color: #cccccc;
            margin: 0;
        }

        /* POSTS */

        .posts-title {
            color: #ff69b4;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .post {
            background: #111111;
            border: 1px solid #ff1493;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 12px rgba(255, 20, 147, 0.1);
            transition: 0.3s ease;
        }

        .post:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 18px rgba(255, 20, 147, 0.3);
        }

        .content {
            color: #f5f5f5;
            line-height: 1.7;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .timestamp {
            color: #bbbbbb;
            font-size: 0.85rem;
            border-top: 1px solid #222222;
            padding-top: 0.8rem;
        }

        /* EMPTY POSTS */

        .empty-posts {
            text-align: center;
            background: #111111;
            border: 1px solid #ff1493;
            border-radius: 15px;
            padding: 3rem;
        }

        .empty-posts i {
            font-size: 4rem;
            color: #ff69b4;
            margin-bottom: 1rem;
        }

        .empty-posts p {
            color: #cccccc;
            font-size: 1.1rem;
        }

        /* FOOTER */

        footer {
            background: #111111;
            border-top: 2px solid #ff1493;
            text-align: center;
            padding: 1rem;
            color: #ff69b4;
        }

        /* RESPONSIVE */

        @media (max-width: 768px) {

            .header-content {
                flex-direction: column;
                text-align: center;
            }

            nav ul {
                justify-content: center;
            }

            .profile-card {
                padding: 1.5rem;
            }
        }

    </style>
</head>

<body>

    <header>

        <div class="header-content">

            <h1>
                <i class="fas fa-heart"></i>
                PinkSocial Hub
            </h1>

            <!-- FIXED NAVIGATION -->

            <nav>
                <ul>

                    <li>
                        <a href="/feed">
                            <i class="fas fa-home"></i> Home
                        </a>
                    </li>

                    <li>
                        <a href="/register">
                            <i class="fas fa-user-plus"></i> Sign Up
                        </a>
                    </li>

                    <li>
                        <a href="/login">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </a>
                    </li>

                    <li>
                        <button id="logoutBtn">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </li>

                </ul>
            </nav>

        </div>

    </header>

    <main>

        <section class="profile">

            <!-- PROFILE CARD -->

            <div class="profile-card">

                <div class="avatar">
                </div>
                <h2></h2>
                <p>
                    Welcome to your PinkSocial profile
                </p>

            </div>

            <!-- POSTS -->

            <h3 class="posts-title">
                <i class="fas fa-images"></i>
                Your Posts
            </h3>

            <div id="userPosts">
                <div class="post">

               <div class="content"></div>
                            </div>

                            <div class="timestamp">
                                <i class="fas fa-clock"></i>
                            </div>

                        </div>
                    <div class="empty-posts">

                        <i class="fas fa-ghost"></i>

                        <p>
                            No posts yet. Start sharing something amazing!
                        </p>

                    </div>
                    </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 PinkSocial Hub</p>
    </footer>

    <script src="/script.js"></script>

</body>
</html>
