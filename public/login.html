<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PinkSocial Hub</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- INTERNAL CSS -->
    <style>

        /* GLOBAL */

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        header {
            background: #111111;
            border-bottom: 2px solid #ff1493;
            padding: 1.5rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: #ff69b4;
            font-size: 2.3rem;
        }

        /* NAVIGATION */

        nav {
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        nav a {
            text-decoration: none;
            color: white;
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            padding: 0.7rem 1.4rem;
            border-radius: 10px;
            transition: 0.3s ease;
            font-weight: bold;
        }

        nav a:hover {
            transform: translateY(-3px);
            background: linear-gradient(45deg, #ff69b4, #ff1493);
        }

        /* MAIN */

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* LOGIN FORM */

        .form {
            width: 100%;
            max-width: 420px;
            background: #111111;
            border: 2px solid #ff1493;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.2);
        }

        .form h2 {
            text-align: center;
            color: #ff69b4;
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        /* INPUTS */

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 16px;
            color: #ff69b4;
        }

        .form input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border-radius: 12px;
            border: 1px solid #ff69b4;
            background: #1a1a1a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form input:focus {
            outline: none;
            border-color: #ff1493;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.4);
        }

        /* BUTTON */

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(45deg, #ff69b4, #ff1493);
        }

        /* EXTRA TEXT */

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #cccccc;
        }

        .register-link a {
            color: #ff69b4;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        footer {
            background: #111111;
            border-top: 2px solid #ff1493;
            text-align: center;
            padding: 1rem;
            color: #ff69b4;
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {

            .form {
                padding: 2rem 1.5rem;
            }

            header h1 {
                font-size: 2rem;
            }

            nav {
                flex-direction: column;
                align-items: center;
            }

            nav a {
                width: 180px;
                text-align: center;
            }
        }

    </style>
</head>

<body>

    <header>

        <h1>
            <i class="fas fa-heart"></i>
            PinkSocial Hub
        </h1>

        <nav>

            <a href="/">
                <i class="fas fa-home"></i> Home
            </a>

            <a href="/register">
                <i class="fas fa-user-plus"></i> Register
            </a>

        </nav>

    </header>

    <main>

        <form id="loginForm" class="form">

            <h2>
                <i class="fas fa-sign-in-alt"></i>
                Login
            </h2>

            <div class="input-group">
                <i class="fas fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn">
                Login
            </button>

            <div class="register-link">
                Don't have an account?
                <a href="/register">Register</a>
            </div>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 PinkSocial Hub</p>
    </footer>

    <script src="/script.js"></script>

</body>
</html>
